name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend syntax check
        working-directory: backend
        run: node --check server.js && node --check store.js

      - name: Backend modules load
        working-directory: backend
        run: |
          node -e "
            const mods = ['ws','@whiskeysockets/baileys','@slack/web-api','@slack/socket-mode','pino','axios','node-emoji','uuid'];
            for (const m of mods) { require(m); console.log('ok', m); }
          "

      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend typecheck and build
        working-directory: frontend
        run: npm run build
